spring:
  datasource:
    # local profile은 빠른 실행을 위해 MySQL 호환 모드 H2 인메모리 DB를 사용한다.
    driver-class-name: org.h2.Driver
    url: ${LOCAL_DB_URL:jdbc:h2:mem:startup;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${LOCAL_DB_USERNAME:sa}
    password: ${LOCAL_DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      # 로컬 기본값은 매 실행마다 스키마를 새로 만든다. 실제 MySQL 확인은 docker profile을 사용한다.
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        highlight_sql: true
    defer-datasource-initialization: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

logging:
  level:
    # 로컬에서는 SQL과 바인딩 값을 확인하기 쉽게 기본 로그를 자세히 둔다.
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:debug}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_SQL_PARAM_LOG:trace}
