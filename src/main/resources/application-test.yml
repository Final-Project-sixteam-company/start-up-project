spring:
  datasource:
    # 테스트는 외부 DB 없이 실행되도록 H2 인메모리 DB를 사용한다.
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:startup-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      # 테스트마다 깨끗한 스키마를 만들고 종료 시 제거한다.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: warn
    com.startup: debug
