server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    # 로컬 개발자는 .env만 만들면 yml을 수정하지 않고 환경값을 덮어쓸 수 있다.
    import: optional:file:.env[.properties]
  application:
    name: start-up
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      file-size-threshold: 0B
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
  jpa:
    # OSIV를 끄고 서비스 트랜잭션 안에서 필요한 연관관계를 명시적으로 조회한다.
    open-in-view: false
  data:
    redis:
      repositories:
        # RedisRepository를 쓰지 않으므로 Spring Data Redis repository 스캔을 끈다.
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:1}
  ai:
    model:
      # none이면 provider bean을 만들지 않아 OPENAI_API_KEY 없이도 서버가 부팅된다.
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.4}

management:
  endpoints:
    web:
      exposure:
        # Prometheus가 메트릭을 긁어갈 수 있도록 prometheus endpoint를 노출한다.
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  # Swagger UI: http://localhost:8080/swagger-ui.html
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: ${LOG_LEVEL_ROOT:info}
    com.startup: ${LOG_LEVEL_APP:debug}

app:
  # 인증 구현 전까지 사용할 임시 사용자 ID다. JWT 도입 후 제거하거나 SecurityContext 기반으로 교체한다.
  mock-user-id: ${MOCK_USER_ID:1}
  cors:
    # 브라우저/WebView 로컬 테스트용 CORS 허용 목록이다. Native Android 앱은 CORS 영향을 받지 않는다.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://10.0.2.2:[*],http://192.168.*.*:[*]}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
