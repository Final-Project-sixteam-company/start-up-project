<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ClueRoom Current Jira Board</title>
  <desc id="desc">Public-safe Jira snapshot for ClueRoom as of 2026-06-20, showing seven non-done issues only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.54" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f4f0ff"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#4353a8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: Inter, Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .title { font-size: 54px; font-weight: 900; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font-size: 23px; font-weight: 600; fill: #dbeafe; letter-spacing: 0; }
      .label { font-size: 22px; font-weight: 800; fill: #475569; letter-spacing: 0; }
      .metric { font-size: 58px; font-weight: 900; fill: #0f172a; letter-spacing: 0; }
      .metricText { font-size: 24px; font-weight: 750; fill: #334155; letter-spacing: 0; }
      .section { font-size: 30px; font-weight: 900; fill: #0f172a; letter-spacing: 0; }
      .issueKey { font-size: 25px; font-weight: 900; fill: #0f172a; letter-spacing: 0; }
      .issueText { font-size: 23px; font-weight: 650; fill: #334155; letter-spacing: 0; }
      .muted { font-size: 20px; font-weight: 600; fill: #64748b; letter-spacing: 0; }
      .small { font-size: 18px; font-weight: 600; fill: #64748b; letter-spacing: 0; }
      .pillText { font-size: 18px; font-weight: 900; fill: #ffffff; letter-spacing: 0; }
      .doneText { font-size: 21px; font-weight: 750; fill: #155e75; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="44" fill="url(#bg)"/>
  <rect x="48" y="44" width="1504" height="184" rx="34" fill="url(#head)" filter="url(#shadow)"/>
  <text x="86" y="126" class="font title">ClueRoom Jira Board</text>
  <text x="88" y="174" class="font subtitle">CURRENT PUBLIC SNAPSHOT · ST PROJECT · UPDATED 2026-06-20</text>
  <rect x="1212" y="82" width="294" height="92" rx="26" fill="#ffffff" fill-opacity="0.14" stroke="#bfdbfe" stroke-opacity="0.42"/>
  <text x="1242" y="119" class="font subtitle">Non-Done 기준</text>
  <text x="1242" y="158" class="mono title" style="font-size:42px">7 issues</text>

  <g filter="url(#shadow)">
    <rect x="66" y="258" width="332" height="168" rx="28" fill="#ffffff"/>
    <rect x="438" y="258" width="332" height="168" rx="28" fill="#ffffff"/>
    <rect x="810" y="258" width="332" height="168" rx="28" fill="#ffffff"/>
    <rect x="1182" y="258" width="332" height="168" rx="28" fill="#ffffff"/>
  </g>

  <text x="96" y="306" class="font label">진행 중</text>
  <text x="96" y="372" class="mono metric">1</text>
  <text x="178" y="369" class="font metricText">ST-36</text>
  <text x="96" y="405" class="font small">프론트 구현 흐름</text>

  <text x="468" y="306" class="font label">티켓발권</text>
  <text x="468" y="372" class="mono metric">6</text>
  <text x="548" y="369" class="font metricText">ST-56, 91-95</text>
  <text x="468" y="405" class="font small">문서 · 데모 · BE · AI · Infra</text>

  <text x="840" y="306" class="font label">완료 산출물</text>
  <text x="840" y="372" class="mono metric">README</text>
  <text x="840" y="405" class="font small">완료 건수 대신 공개 산출물 기준</text>

  <text x="1212" y="306" class="font label">공개 기준</text>
  <text x="1212" y="362" class="mono metric" style="font-size:46px">SAFE</text>
  <text x="1212" y="405" class="font small">담당자 · 댓글 · secret 제외</text>

  <rect x="66" y="470" width="698" height="366" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <text x="96" y="526" class="font section">현재 남은 Jira 큐</text>
  <text x="96" y="562" class="font muted">삭제 후 남은 non-Done 이슈만 표시합니다.</text>

  <g transform="translate(96 604)">
    <rect x="0" y="0" width="638" height="52" rx="16" fill="#fef3c7"/>
    <text x="22" y="34" class="mono issueKey">ST-36</text>
    <rect x="124" y="13" width="88" height="26" rx="13" fill="#f59e0b"/>
    <text x="143" y="33" class="font pillText">진행</text>
    <text x="234" y="34" class="font issueText">ClueRoom 프론트 구현 흐름</text>

    <rect x="0" y="66" width="638" height="52" rx="16" fill="#eef2ff"/>
    <text x="22" y="100" class="mono issueKey">ST-56</text>
    <rect x="124" y="79" width="96" height="26" rx="13" fill="#6366f1"/>
    <text x="141" y="99" class="font pillText">대기</text>
    <text x="234" y="100" class="font issueText">인프라 고도화 및 운영 자동화</text>

    <rect x="0" y="132" width="638" height="52" rx="16" fill="#eef2ff"/>
    <text x="22" y="166" class="mono issueKey">ST-91</text>
    <rect x="124" y="145" width="96" height="26" rx="13" fill="#6366f1"/>
    <text x="141" y="165" class="font pillText">대기</text>
    <text x="234" y="166" class="font issueText">발표용 Notion/Confluence 리디자인</text>

    <rect x="0" y="198" width="638" height="52" rx="16" fill="#eef2ff"/>
    <text x="22" y="232" class="mono issueKey">ST-92</text>
    <rect x="124" y="211" width="96" height="26" rx="13" fill="#6366f1"/>
    <text x="141" y="231" class="font pillText">대기</text>
    <text x="234" y="232" class="font issueText">발표 페이지 목차와 섹션 구조 확장</text>

    <rect x="0" y="264" width="638" height="52" rx="16" fill="#eef2ff"/>
    <text x="22" y="298" class="mono issueKey">ST-93</text>
    <rect x="124" y="277" width="96" height="26" rx="13" fill="#6366f1"/>
    <text x="141" y="297" class="font pillText">대기</text>
    <text x="234" y="298" class="font issueText">데모 시나리오와 발표 스토리라인</text>
  </g>

  <rect x="836" y="470" width="698" height="366" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <text x="866" y="526" class="font section">보강 큐와 공개 산출물</text>
  <text x="866" y="562" class="font muted">완료 건수는 이미지에 고정하지 않고 README/브로셔 근거로 분리합니다.</text>

  <g transform="translate(866 604)">
    <rect x="0" y="0" width="638" height="52" rx="16" fill="#eef2ff"/>
    <text x="22" y="34" class="mono issueKey">ST-94</text>
    <rect x="124" y="13" width="96" height="26" rx="13" fill="#6366f1"/>
    <text x="141" y="33" class="font pillText">대기</text>
    <text x="234" y="34" class="font issueText">백엔드 도메인 모델과 API 계약 시각화</text>

    <rect x="0" y="66" width="638" height="52" rx="16" fill="#eef2ff"/>
    <text x="22" y="100" class="mono issueKey">ST-95</text>
    <rect x="124" y="79" width="96" height="26" rx="13" fill="#6366f1"/>
    <text x="141" y="99" class="font pillText">대기</text>
    <text x="234" y="100" class="font issueText">AI 심문 안전 정책과 LLMOps 관측</text>

    <rect x="0" y="148" width="638" height="154" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="24" y="190" class="font doneText">완료 산출물은 고정 count 대신 아래 근거로 설명</text>
    <text x="24" y="230" class="font issueText">Backend 344 PASS · Android 32 PASS · Web 23 tests</text>
    <text x="24" y="266" class="font issueText">P95 241ms → 19ms · AI quota 150/350 · Scale-out 21/19/20</text>
  </g>

  <rect x="66" y="872" width="1468" height="64" rx="22" fill="#0f172a" fill-opacity="0.92"/>
  <text x="98" y="912" class="font small" fill="#e2e8f0">Public-safe: issue key, status, summary, 공개 산출물 수치만 표시합니다. 담당자, 댓글, 내부 URL, secret, token, raw prompt/answer, 정답 정보는 제외했습니다.</text>
</svg>
