<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ClueRoom Jira Delivery Board</title>
  <desc id="desc">Public-safe portfolio board summarizing Jira ST delivery flow for ClueRoom.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f6efe4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #efe7da; }
      .panel { fill: url(#paper); stroke: #e7d7c2; stroke-width: 2; filter: url(#shadow); }
      .hero { fill: url(#hero); }
      .label { font: 700 22px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; letter-spacing: 1.2px; fill: #e2e8f0; }
      .title { font: 800 60px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #ffffff; }
      .subtitle { font: 500 27px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #dbeafe; }
      .small { font: 500 22px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #475569; }
      .tiny { font: 500 18px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #64748b; }
      .metricNo { font: 900 58px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #111827; }
      .metricLabel { font: 700 21px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #334155; }
      .section { font: 800 28px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #111827; }
      .sectionSub { font: 500 20px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #64748b; }
      .chipText { font: 700 19px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #172033; }
      .body { font: 500 20px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #334155; }
      .bodyStrong { font: 800 20px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #111827; }
      .white { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #eadcc9; stroke-width: 1.4; }
      .green { fill: #dcfce7; stroke: #86efac; }
      .blue { fill: #dbeafe; stroke: #93c5fd; }
      .amber { fill: #fef3c7; stroke: #facc15; }
      .rose { fill: #ffe4e6; stroke: #fda4af; }
      .ink { fill: #0f172a; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect x="44" y="42" width="1512" height="916" rx="28" class="panel"/>

  <rect x="72" y="70" width="1456" height="224" rx="24" class="hero"/>
  <text x="112" y="124" class="label">JIRA DELIVERY BOARD · ST</text>
  <text x="112" y="194" class="title">ClueRoom 산출물 관리 현황</text>
  <text x="112" y="242" class="subtitle">최종프로젝트 칸반보드에서 공개 가능한 이슈 흐름만 정리한 포트폴리오 보드</text>
  <rect x="1180" y="104" width="286" height="140" rx="22" fill="#ffffff" opacity="0.14"/>
  <text x="1212" y="152" class="subtitle">Project</text>
  <text x="1212" y="202" class="title" style="font-size:50px">ST</text>
  <text x="1212" y="236" class="label" style="font-size:18px">최종프로젝트 칸반보드</text>

  <g transform="translate(86 326)">
    <rect x="0" y="0" width="336" height="132" rx="18" class="card"/>
    <text x="28" y="62" class="metricNo">68</text>
    <text x="128" y="48" class="metricLabel">완료 이슈</text>
    <text x="128" y="82" class="tiny">백엔드·인프라·AI·QA 산출물</text>
    <rect x="28" y="104" width="280" height="10" rx="5" fill="#16a34a"/>
  </g>
  <g transform="translate(452 326)">
    <rect x="0" y="0" width="336" height="132" rx="18" class="card"/>
    <text x="28" y="62" class="metricNo">13</text>
    <text x="128" y="48" class="metricLabel">진행·대기 이슈</text>
    <text x="128" y="82" class="tiny">공개 보강·보안 게이트 포함</text>
    <rect x="28" y="104" width="230" height="10" rx="5" fill="#f59e0b"/>
  </g>
  <g transform="translate(818 326)">
    <rect x="0" y="0" width="336" height="132" rx="18" class="card"/>
    <text x="28" y="62" class="metricNo">9</text>
    <text x="128" y="48" class="metricLabel">공개 보강 큐</text>
    <text x="128" y="82" class="tiny">ST-87 ~ ST-95 중심</text>
    <rect x="28" y="104" width="188" height="10" rx="5" fill="#2563eb"/>
  </g>
  <g transform="translate(1184 326)">
    <rect x="0" y="0" width="300" height="132" rx="18" class="card"/>
    <text x="28" y="62" class="metricNo" style="font-size:48px">public</text>
    <text x="28" y="94" class="metricLabel">safe 기준 정리</text>
    <text x="28" y="120" class="tiny">계정·댓글·내부값 제외</text>
  </g>

  <g transform="translate(86 500)">
    <rect x="0" y="0" width="460" height="330" rx="20" class="card"/>
    <rect x="0" y="0" width="460" height="74" rx="20" class="green"/>
    <text x="26" y="46" class="section">완료된 구현 근거</text>
    <text x="26" y="102" class="sectionSub">플레이 경험과 서버 계약을 닫은 핵심 티켓</text>
    <text x="26" y="144" class="bodyStrong">ST-28</text><text x="104" y="144" class="body">AI 심문 서비스 / ResponsePolicy</text>
    <text x="26" y="184" class="bodyStrong">ST-29</text><text x="104" y="184" class="body">최종 추리 제출과 결과 조회 API</text>
    <text x="26" y="224" class="bodyStrong">ST-30</text><text x="104" y="224" class="body">시나리오 라이브러리 API</text>
    <text x="26" y="264" class="bodyStrong">ST-84~86</text><text x="126" y="264" class="body">커스텀·커뮤니티·관리 API</text>
    <text x="26" y="304" class="bodyStrong">ST-34</text><text x="104" y="304" class="body">AI 시나리오 검증 흐름</text>
  </g>

  <g transform="translate(570 500)">
    <rect x="0" y="0" width="460" height="330" rx="20" class="card"/>
    <rect x="0" y="0" width="460" height="74" rx="20" class="blue"/>
    <text x="26" y="46" class="section">운영·인프라 근거</text>
    <text x="26" y="102" class="sectionSub">배포, 관측, 복구, 확장성까지 문서화</text>
    <text x="26" y="144" class="bodyStrong">ST-20~27</text><text x="126" y="144" class="body">서버·Docker·Nginx·HTTPS·Blue-Green</text>
    <text x="26" y="184" class="bodyStrong">ST-65~68</text><text x="126" y="184" class="body">LLMOps·AI 로그·스포일러 방어</text>
    <text x="26" y="224" class="bodyStrong">ST-75</text><text x="104" y="224" class="body">MySQL 복구 리허설 계획</text>
    <text x="26" y="264" class="bodyStrong">ST-76~78</text><text x="126" y="264" class="body">역할 분리·LB·Blue-Green PoC</text>
    <text x="26" y="304" class="bodyStrong">ST-80~82</text><text x="126" y="304" class="body">이미지 태그 전략과 AI provider 대응</text>
  </g>

  <g transform="translate(1054 500)">
    <rect x="0" y="0" width="430" height="330" rx="20" class="card"/>
    <rect x="0" y="0" width="430" height="74" rx="20" class="amber"/>
    <text x="26" y="46" class="section">현재 보강 큐</text>
    <text x="26" y="102" class="sectionSub">최종 공개 전 안전성과 발표 밀도 보강</text>
    <text x="26" y="144" class="bodyStrong">ST-87</text><text x="104" y="144" class="body">public API 스포일러성 필드 정리</text>
    <text x="26" y="184" class="bodyStrong">ST-88~90</text><text x="126" y="184" class="body">secret 검증·auth gate·secure storage</text>
    <text x="26" y="224" class="bodyStrong">ST-91~92</text><text x="126" y="224" class="body">Notion/Confluence 발표 페이지</text>
    <text x="26" y="264" class="bodyStrong">ST-93~95</text><text x="126" y="264" class="body">데모·백엔드 시각화·AI/LLMOps</text>
    <text x="26" y="304" class="bodyStrong">ST-36</text><text x="104" y="304" class="body">프론트 구현 흐름 추적</text>
  </g>

  <g transform="translate(86 858)">
    <rect x="0" y="0" width="1398" height="72" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="28" y="31" class="bodyStrong">브로셔 반영 원칙</text>
    <text x="28" y="58" class="tiny">원본 Jira는 로그인 환경에 따라 접근이 제한될 수 있으므로, 공개 페이지에는 이슈 키·상태·산출물 연결만 요약합니다. 담당자 계정, 내부 댓글, secret, raw prompt/answer는 제외했습니다.</text>
  </g>
</svg>
