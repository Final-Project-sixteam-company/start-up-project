<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ClueRoom Jira Delivery Board</title>
  <desc id="desc">Public-safe portfolio board summarizing current Jira ST delivery flow for ClueRoom after board cleanup.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f6efe4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #efe7da; }
      .panel { fill: url(#paper); stroke: #e7d7c2; stroke-width: 2; filter: url(#shadow); }
      .hero { fill: url(#hero); }
      .label { font: 700 22px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; letter-spacing: 1.2px; fill: #e2e8f0; }
      .title { font: 800 58px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #ffffff; }
      .subtitle { font: 500 26px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #dbeafe; }
      .tiny { font: 500 18px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #64748b; }
      .metricNo { font: 900 56px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #111827; }
      .metricLabel { font: 800 21px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #334155; }
      .section { font: 800 28px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #111827; }
      .sectionSub { font: 500 20px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #64748b; }
      .body { font: 500 20px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #334155; }
      .bodyStrong { font: 800 20px 'Pretendard','Noto Sans KR','Segoe UI',Arial,sans-serif; fill: #111827; }
      .card { fill: #ffffff; stroke: #eadcc9; stroke-width: 1.4; }
      .green { fill: #dcfce7; stroke: #86efac; }
      .blue { fill: #dbeafe; stroke: #93c5fd; }
      .amber { fill: #fef3c7; stroke: #facc15; }
      .rose { fill: #ffe4e6; stroke: #fda4af; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect x="44" y="42" width="1512" height="916" rx="28" class="panel"/>

  <rect x="72" y="70" width="1456" height="224" rx="24" class="hero"/>
  <text x="112" y="124" class="label">JIRA DELIVERY BOARD · ST · UPDATED 2026-06-20</text>
  <text x="112" y="194" class="title">ClueRoom 산출물 관리 현황</text>
  <text x="112" y="242" class="subtitle">정리 후 현재 남은 이슈와 완료 산출물 흐름만 public-safe로 요약</text>
  <rect x="1166" y="102" width="314" height="146" rx="22" fill="#ffffff" opacity="0.14"/>
  <text x="1200" y="152" class="subtitle">Project</text>
  <text x="1200" y="202" class="title" style="font-size:50px">ST</text>
  <text x="1200" y="236" class="label" style="font-size:18px">최종프로젝트 칸반보드</text>

  <g transform="translate(86 326)">
    <rect x="0" y="0" width="336" height="132" rx="18" class="card"/>
    <text x="28" y="62" class="metricNo">1</text>
    <text x="96" y="48" class="metricLabel">진행 중</text>
    <text x="96" y="82" class="tiny">ST-36 프론트 구현 흐름</text>
    <rect x="28" y="104" width="172" height="10" rx="5" fill="#f59e0b"/>
  </g>
  <g transform="translate(452 326)">
    <rect x="0" y="0" width="336" height="132" rx="18" class="card"/>
    <text x="28" y="62" class="metricNo">6</text>
    <text x="96" y="48" class="metricLabel">티켓발권</text>
    <text x="96" y="82" class="tiny">ST-56, ST-91~ST-95</text>
    <rect x="28" y="104" width="232" height="10" rx="5" fill="#2563eb"/>
  </g>
  <g transform="translate(818 326)">
    <rect x="0" y="0" width="336" height="132" rx="18" class="card"/>
    <text x="28" y="62" class="metricNo">5</text>
    <text x="96" y="48" class="metricLabel">공개 문서 큐</text>
    <text x="96" y="82" class="tiny">Notion · 데모 · BE · AI</text>
    <rect x="28" y="104" width="214" height="10" rx="5" fill="#7c3aed"/>
  </g>
  <g transform="translate(1184 326)">
    <rect x="0" y="0" width="300" height="132" rx="18" class="card"/>
    <text x="28" y="62" class="metricNo" style="font-size:46px">public</text>
    <text x="28" y="94" class="metricLabel">safe board</text>
    <text x="28" y="120" class="tiny">담당자·댓글·secret 제외</text>
  </g>

  <g transform="translate(86 500)">
    <rect x="0" y="0" width="460" height="330" rx="20" class="card"/>
    <rect x="0" y="0" width="460" height="74" rx="20" class="green"/>
    <text x="26" y="46" class="section">완료된 구현 근거</text>
    <text x="26" y="102" class="sectionSub">플레이 경험과 서버 계약을 닫은 핵심 티켓</text>
    <text x="26" y="144" class="bodyStrong">ST-28</text><text x="104" y="144" class="body">AI 심문 서비스 / ResponsePolicy</text>
    <text x="26" y="184" class="bodyStrong">ST-29</text><text x="104" y="184" class="body">최종 추리 제출과 결과 조회 API</text>
    <text x="26" y="224" class="bodyStrong">ST-30</text><text x="104" y="224" class="body">시나리오 라이브러리 API</text>
    <text x="26" y="264" class="bodyStrong">ST-83~86</text><text x="126" y="264" class="body">커스텀·커뮤니티·관리 API</text>
    <text x="26" y="304" class="bodyStrong">ST-34</text><text x="104" y="304" class="body">AI 시나리오 검증 흐름</text>
  </g>

  <g transform="translate(570 500)">
    <rect x="0" y="0" width="460" height="330" rx="20" class="card"/>
    <rect x="0" y="0" width="460" height="74" rx="20" class="blue"/>
    <text x="26" y="46" class="section">운영·인프라 근거</text>
    <text x="26" y="102" class="sectionSub">배포, 관측, 복구, 확장성까지 문서화</text>
    <text x="26" y="144" class="bodyStrong">ST-20~27</text><text x="126" y="144" class="body">서버·Docker·Nginx·HTTPS·Blue-Green</text>
    <text x="26" y="184" class="bodyStrong">ST-57~68</text><text x="126" y="184" class="body">Rate limit·관측·LLMOps·스포일러 방어</text>
    <text x="26" y="224" class="bodyStrong">ST-69~75</text><text x="126" y="224" class="body">Runbook·snapshot·S3 backup·복구 계획</text>
    <text x="26" y="264" class="bodyStrong">ST-76~78</text><text x="126" y="264" class="body">역할 분리·수동 LB·Blue-Green PoC</text>
    <text x="26" y="304" class="bodyStrong">ST-80~82</text><text x="126" y="304" class="body">이미지 태그·DB migration·AI provider 대응</text>
  </g>

  <g transform="translate(1054 500)">
    <rect x="0" y="0" width="430" height="330" rx="20" class="card"/>
    <rect x="0" y="0" width="430" height="74" rx="20" class="amber"/>
    <text x="26" y="46" class="section">현재 남은 Jira 큐</text>
    <text x="26" y="102" class="sectionSub">삭제 후 남은 항목만 반영</text>
    <text x="26" y="144" class="bodyStrong">ST-36</text><text x="104" y="144" class="body">ClueRoom 프로젝트 프론트 작성</text>
    <text x="26" y="184" class="bodyStrong">ST-56</text><text x="104" y="184" class="body">인프라 고도화 및 운영 자동화 epic</text>
    <text x="26" y="224" class="bodyStrong">ST-91~92</text><text x="126" y="224" class="body">Notion/Confluence 발표 페이지</text>
    <text x="26" y="264" class="bodyStrong">ST-93</text><text x="104" y="264" class="body">데모 시나리오와 발표 스토리라인</text>
    <text x="26" y="304" class="bodyStrong">ST-94~95</text><text x="126" y="304" class="body">백엔드 시각화 · AI/LLMOps 관측</text>
  </g>

  <g transform="translate(86 858)">
    <rect x="0" y="0" width="1398" height="72" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="28" y="31" class="bodyStrong">브로셔 반영 원칙</text>
    <text x="28" y="58" class="tiny">Jira 원본은 로그인 환경에 따라 제한될 수 있어 공개 페이지에는 현재 남은 이슈 키·상태·산출물 연결만 요약합니다. 담당자 계정, 내부 댓글, secret, raw prompt/answer는 제외했습니다.</text>
  </g>
</svg>
