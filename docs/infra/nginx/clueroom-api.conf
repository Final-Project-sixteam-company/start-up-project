server {
    server_name api.clueroom.xyz;

    client_max_body_size 12M;

    # Current security baseline snippets. Keep these in the recovery template.
    include /etc/nginx/snippets/clueroom-cn-block.conf;
    include /etc/nginx/snippets/clueroom-blocked-ips.conf;

    # Public health check only. All other actuator endpoints are blocked below.
    # Health stays rate-limit free for uptime checks; server-level block snippets still apply.
    location = /actuator/health {
        proxy_pass http://clueroom_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-ClueRoom-Upstream $upstream_addr always;
    }

    # Do not expose metrics or sensitive actuator endpoints on the public API.
    location = /actuator/prometheus {
        access_log off;
        return 404;
    }

    location ~* ^/actuator/(?!health$) {
        access_log off;
        return 404;
    }

    # Drop common secret and VCS scan paths before they hit Spring Boot.
    location ~* ^/\.env(?:\..*)?$ {
        access_log off;
        return 404;
    }

    location ~* ^/\.(?:git|svn|hg)(?:/.*)?$ {
        access_log off;
        return 404;
    }

    # Drop common CMS/admin scan paths.
    location ~* ^/(?:wp-admin(?:/.*)?|wp-login\.php|xmlrpc\.php)$ {
        access_log off;
        return 404;
    }

    location ~* ^/(?:phpmyadmin|pma|adminer)(?:/.*)?$ {
        access_log off;
        return 404;
    }

    # Drop common source/package/backup scan paths.
    location ~* ^/(?:composer\.(?:json|lock)|vendor(?:/.*)?|\.DS_Store|backup(?:/.*)?|dump(?:/.*)?|config\.php)$ {
        access_log off;
        return 404;
    }

    location / {
        limit_req zone=clueroom_api_per_ip burst=60 nodelay;
        limit_req_dry_run off;
        limit_req_status 429;
        limit_conn clueroom_conn_per_ip 30;

        proxy_pass http://clueroom_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-ClueRoom-Upstream $upstream_addr always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.clueroom.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.clueroom.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.clueroom.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.clueroom.xyz;
    return 404; # managed by Certbot


}
