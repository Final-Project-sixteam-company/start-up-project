server {
    server_name api.clueroom.xyz;

    client_max_body_size 12M;

    # Public health check only. All other actuator endpoints are blocked below.
    location = /actuator/health {
        proxy_pass http://clueroom_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-ClueRoom-Upstream $upstream_addr always;
    }

    # Do not expose metrics or sensitive actuator endpoints on the public API.
    location = /actuator/prometheus {
        access_log off;
        return 404;
    }

    location ~* ^/actuator/(?!health$) {
        access_log off;
        return 404;
    }

    # Drop common bot scan paths before they hit Spring Boot.
    location ~* ^/(?:\.env(?:\..*)?|\.git(?:/.*)?|\.svn(?:/.*)?|\.hg(?:/.*)?|wp-admin(?:/.*)?|wp-login\.php|xmlrpc\.php|phpmyadmin(?:/.*)?|pma(?:/.*)?|adminer(?:/.*)?|composer\.(?:json|lock)|vendor(?:/.*)?|\.DS_Store|backup(?:/.*)?|dump(?:/.*)?|config\.php)$ {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://clueroom_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-ClueRoom-Upstream $upstream_addr always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.clueroom.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.clueroom.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.clueroom.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.clueroom.xyz;
    return 404; # managed by Certbot


}
