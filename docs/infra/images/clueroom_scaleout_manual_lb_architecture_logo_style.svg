<text x="110" y="1220" class="font small" text-anchor="start"><tspan x="110" dy="0">DB/Redis가 data 서버로 분리되어 app 노드를 추가해도 데이터 source of truth는 유지된다. prod Nginx는 1차 PoC에서 수동 LB 역할을 하고, 향후 Terraform</tspan><tspan x="110" dy="24">output → config generation → reload 자동화로 확장할 수 있다.</tspan></text>
<text x="80" y="1310" class="font small" text-anchor="start" fill="#64748b"><tspan x="80" dy="0">Note: 공식 로고 파일이 아니라 발표용 로고형 배지와 브랜드 색상 기반 아이콘으로 구성한 이미지입니다.</tspan></text>
